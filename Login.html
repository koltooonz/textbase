            <a href="index.html">Back</a> <h1>Login</h1>
            <div class="input-box">
                <input type="text" placeholder="Username" id="username" required>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password" id="password" required>
            </div>
            <div class="remember-forget">
                <label><input type="checkbox" id="rememberMe"> Remember me</label>
                <a href="Forgot.html">Forgot password?</a>

            <button type="submit" class="btn" id="submit">Login</button>

};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // On page load, check if we should pre-fill
const rememberMe = document.getElementById("rememberMe");
const savedUser = localStorage.getItem('rememberedUser');
if (savedUser) {
    document.getElementById("username").value = savedUser;
    rememberMe.checked = true;
}

// In your submit handler, after successful login:

    localStorage.setItem('rememberedUser', username);
} else {
    localStorage.removeItem('rememberedUser');
}   

        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const pass = document.getElementById("password").value;

            // Convert username to email format for Firebase
            const email = username + "@textbase.app";

            signInWithEmailAndPassword(auth, email, pass)
                .then((userCredential) => {
                    const user = userCredential.user;
                    localStorage.setItem('user', username);
                    window.location.href = "mainscreen.html";
                })
                .catch((error) => {
                    alert("Invalid username or password.");
                });
        });
    </script>
