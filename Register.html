<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style3.css">
    <title>Textbase</title>
</head>
<body>
    <div class="wrapper">
        <a href="index.html">Back</a> <h1>Register</h1>
        <form id="registerForm">
            <div class="input-box">
                <input type="text" placeholder="Username" id="username" required>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password" id="password" required>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Confirm Password" id="confirmPassword" required>
            </div>
            <button type="submit" class="btn">Register</button>
        </form>
        <div class="register-link">
            <p>Already have an account? <a href="Login.html">Login</a></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
  apiKey: "AIzaSyDZDtz73iSFnUjTVuQHgtoxZi2Pnw_W51I",
  authDomain: "textbase-c1696.firebaseapp.com",
  projectId: "textbase-c1696",
  storageBucket: "textbase-c1696.firebasestorage.app",
  messagingSenderId: "579485642493",
  appId: "1:579485642493:web:0465534f5dbdcdb82e5894",
  measurementId: "G-QZ13P0JYTS"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById("registerForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            const confirm = document.getElementById("confirmPassword").value;

            if (pass !== confirm) {
                alert("Passwords do not match.");
                return;
            }

            const email = username + "@textbase.app";

            createUserWithEmailAndPassword(auth, email, pass)
                .then(() => {
                    alert("Account created! You can now log in.");
                    window.location.href = "Login.html";
                })
                .catch((error) => {
                    if (error.code === "email-already-in-use") {
                        alert("Username already taken.");
                    } else {
                        alert(error.message);
                    }
                });
        });
    </script>
</body>
</html>
