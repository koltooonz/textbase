        <!-- Pumpkin image (put your pumpkin.png in the same folder) -->
<img src="pumpkin.png" id="pumpkin" alt="Pumpkin">
<b class="version">Ver. 1.3 (halloween!!!)</b>
<script>
    const squeak = new Audio("squeak.mp3"); // put squeak.mp3 in the same folder

    document.getElementById("pumpkin").addEventListener("click", function() {
        // Play the squeak
        squeak.currentTime = 0;
        squeak.play();

        // Trigger the squish animation
        this.classList.remove("squish");
        void this.offsetWidth; // force reflow so animation restarts
        this.classList.add("squish");
    });
</script>
