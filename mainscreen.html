<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textbase</title>
    <style>
        .header {
            display: flex;
            align-items: left;
            padding: 10px;
            background-color: #535353;
            position: fixed;
            top: 10px;
            left: 0;
            right: 0;
            border-radius: 12px;
        }
        .textbase {
            font-size: 25px;
            margin-right: 10px;
            color: #f1f3f4;
        }
        .user-info {
            margin-left: auto;
            font-size: 20px;
            margin-right: 10px;
            color: #fff;
        }
        .logo {
            width: 60px;
            height: 60px;
            margin-right: 20px;
            border-radius: 6px;
            border: 4px solid #333;
        }
        body {
            background-color: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .logout-link a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            margin: 0px;
        }
        .logout-link a:hover {
            text-decoration: underline;
        }
        .side-menu {
            height: 480px;
            width: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background-color: #535353;
            position: fixed;
            top: 120px;
            left: 0;
            border-radius: 12px;
        }
        .server-one button,
        .server-two button,
        .server-three button,
        .server-four button,
        .server-five button {
            height: 60px;
            width: 60px;
            background-color: #323438;
            border-radius: 15px;
            transition: background-color 0.5s ease;
            border: none;
            cursor: pointer;
        }
        .server-one button h3,
        .server-two button h3,
        .server-three button h3,
        .server-four button h3,
        .server-five button h3 {
            color: #fff;
            font-size: 12px;
        }
        .server-one button:hover,
        .server-two button:hover,
        .server-three button:hover,
        .server-four button:hover,
        .server-five button:hover {
            background-color: #202124;
        }
        .server-one button.active,
        .server-two button.active,
        .server-three button.active,
        .server-four button.active,
        .server-five button.active {
            background-color: #5865f2;
        }

        /* Chat panel */
        .chat-panel {
            position: fixed;
            top: 100px;
            left: 160px;
            right: 20px;
            bottom: 20px;
            background-color: #313338;
            border-radius: 12px;
            display: none;
            flex-direction: column;
        }
        .chat-panel.open { display: flex; }
        .chat-header {
            padding: 14px 20px;
            background-color: #383a40;
            border-radius: 12px 12px 0 0;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg {
            max-width: 70%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            color: #fff;
        }
        .msg.me { align-self: flex-end; background: #5865f2; }
        .msg.other { align-self: flex-start; background: #404249; }
        .msg .name { font-size: 11px; color: #b5bac1; margin-bottom: 2px; }
        .input-bar {
            display: flex;
            padding: 12px 20px;
            gap: 10px;
            background-color: #383a40;
            border-radius: 0 0 12px 12px;
        }
        .input-bar input {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            background: #202124;
            color: #fff;
            font-size: 14px;
        }
        .input-bar button {
            padding: 10px 20px;
            background: #5865f2;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .input-bar button:hover { background: #4752c4; }
    </style>
</head>
<body>
    <header class='header'>
        <img src="TextbaseLogo.jpeg" class='logo'>
        <h3 class='textbase'>Textbase</h3>
        <div class='user-info' id='user-info'></div>
        <div class='logout-link'>
            <a href='Textbase.html'>Log out</a>
        </div>
    </header>

    <div class='side-menu'>
        <button id="serverBtn1"><h3>+ Add</h3></button>
        <button id="serverBtn2"><h3>+ Add</h3></button>
        <button id="serverBtn3"><h3>+ Add</h3></button>
        <button id="serverBtn4"><h3>+ Add</h3></button>
        <button id="serverBtn5"><h3>+ Add</h3></button>
    </div>

    <div class="chat-panel" id="chatPanel">
        <div class="chat-header" id="chatHeader"></div>
        <div class="messages" id="messages"></div>
        <div class="input-bar">
            <input id="msgInput" placeholder="Type a message…">
            <button id="sendMsgBtn">Send</button>
        </div>
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, get } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDTcE0vUwWLsXeEJ9CbCjlGctv2rrF0syU",
  authDomain: "textbase-b64a9.firebaseapp.com",
  databaseURL: "https://textbase-b64a9-default-rtdb.firebaseio.com",
  projectId: "textbase-b64a9",
  storageBucket: "textbase-b64a9.firebasestorage.app",
  messagingSenderId: "138539179523",
  appId: "1:138539179523:web:5f3703952450444c6a7836",
  measurementId: "G-1VVKZ0N356"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const user = localStorage.getItem("user") || "Guest";
document.getElementById("user-info").textContent = user;

const serverSlots = {};
let activeSlot = null;
let currentListener = null;

// ── Wire up buttons ────────────────────────────────────────────
[1, 2, 3, 4, 5].forEach(slot => {
  document.getElementById(`serverBtn${slot}`).addEventListener('click', () => handleServer(slot));
});

document.getElementById('sendMsgBtn').addEventListener('click', send);

document.getElementById('msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});

// ── Load saved server slots from Firebase ──────────────────────
async function loadServers() {
  const snap = await get(ref(db, `userServers/${user}`));
  if (snap.exists()) {
    const data = snap.val();
    for (const slot of [1, 2, 3, 4, 5]) {
      if (data[slot]) {
        serverSlots[slot] = { id: data[slot].id, name: data[slot].name };
        document.getElementById(`serverBtn${slot}`)
          .querySelector("h3").textContent = data[slot].name.slice(0, 8);
      }
    }
  }
}
loadServers();

// ── Handle server button click ─────────────────────────────────
function handleServer(slot) {
  const btn = document.getElementById(`serverBtn${slot}`);

  if (serverSlots[slot]) {
    openChat(slot);
  } else {
    const id = prompt("Enter server ID:");
    if (!id) return;
    serverSlots[slot] = { id, name: id };
    btn.querySelector("h3").textContent = id.slice(0, 8);
    set(ref(db, `userServers/${user}/${slot}`), { id, name: id });
    openChat(slot);
  }
}

// ── Open chat panel & subscribe to live messages ───────────────
function openChat(slot) {
  activeSlot = slot;
  document.querySelectorAll('.side-menu button').forEach(b => b.classList.remove('active'));
  document.getElementById(`serverBtn${slot}`).classList.add('active');

  const s = serverSlots[slot];
  document.getElementById("chatPanel").classList.add("open");
  document.getElementById("chatHeader").textContent = "# " + s.name;

  if (currentListener) currentListener();

  currentListener = onValue(ref(db, `servers/${s.id}/messages`), (snap) => {
    const box = document.getElementById("messages");
    const data = snap.val();
    if (!data) { box.innerHTML = ""; return; }

    box.innerHTML = Object.entries(data).map(([key, m]) => {
      const isMe = m.name === user;
      return `<div class="msg ${isMe ? 'me' : 'other'}">
        <div class="name">${m.name}</div>${m.text}
      </div>`;
    }).join("");
    box.scrollTop = box.scrollHeight;
  });
}

// ── Send a message ─────────────────────────────────────────────
function send() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text || !activeSlot) return;

  const s = serverSlots[activeSlot];
  push(ref(db, `servers/${s.id}/messages`), {
    name: user,
    text,
    timestamp: Date.now()
  });
  input.value = "";
}
</script>
</body>
</html>
